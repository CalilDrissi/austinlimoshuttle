{% extends "notifications/email/_base.html" %}
{% block body %}
<h1 style="font-size:20px;margin:0 0 6px">Your driver is assigned</h1>
<p style="margin:0 0 20px;color:#5b636d">Here's who will be collecting you.</p>

<div style="background:#e8f4ef;border-radius:8px;padding:16px;margin:0 0 20px">
  <div style="font-weight:700;font-size:16px">{{ driver.full_name }}</div>
  {% if driver.phone %}<div style="color:#5b636d;font-size:14.5px;margin-top:3px">{{ driver.phone }}</div>{% endif %}
</div>

{% include "notifications/email/_itinerary.html" %}
{% endblock %}
