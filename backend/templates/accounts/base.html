<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Account{% endblock %} — Austin Limo Shuttle</title>
<style>
  :root{--ink:#15181c;--muted:#5b636d;--line:#e2e7ec;--bg:#f4f6f8;--panel:#fff;
        --accent:#0f6b4f;--accent-bg:#e8f4ef;--danger:#8a3a34;--danger-bg:#fbeceb}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased;display:flex;min-height:100vh;
       align-items:center;justify-content:center;padding:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:32px;max-width:460px;width:100%}
  .brand{font-weight:700;letter-spacing:-.01em;margin-bottom:20px;color:var(--accent)}
  h1{font-size:21px;margin:0 0 8px;letter-spacing:-.015em}
  p{margin:0 0 14px;color:var(--muted);font-size:15px}
  label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
  input[type=text],input[type=email],input[type=password]{
    width:100%;font:inherit;padding:9px 11px;border:1px solid #cdd5dd;border-radius:7px}
  button{font:inherit;font-weight:600;padding:10px 18px;border:0;border-radius:7px;
         background:var(--accent);color:#fff;cursor:pointer;margin-top:18px;width:100%}
  button:hover{filter:brightness(1.07)}
  .errors{background:var(--danger-bg);color:var(--danger);border-radius:7px;
          padding:10px 13px;font-size:14px;margin-bottom:14px}
  .errors ul{margin:0;padding-left:18px}
  .helptext{font-size:13px;color:var(--muted);margin-top:5px}
  .helptext ul{margin:4px 0 0;padding-left:18px}
  a{color:var(--accent)}
  .ok{background:var(--accent-bg);color:var(--accent);border-radius:7px;
      padding:12px 14px;font-size:14.5px;margin-bottom:14px}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Austin Limo Shuttle</div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
