{% if status == 'completed' %}<span class="badge text-bg-success-subtle text-success-emphasis badge-status">{{ label }}</span>
{% elif status == 'confirmed' %}<span class="badge text-bg-primary-subtle text-primary-emphasis badge-status">{{ label }}</span>
{% elif status == 'pending' %}<span class="badge text-bg-warning-subtle text-warning-emphasis badge-status">{{ label }}</span>
{% elif status == 'cancelled' %}<span class="badge text-bg-danger-subtle text-danger-emphasis badge-status">{{ label }}</span>
{% elif status == 'no_show' %}<span class="badge text-bg-dark-subtle text-dark-emphasis badge-status">{{ label }}</span>
{% else %}<span class="badge text-bg-secondary badge-status">{{ label }}</span>{% endif %}
