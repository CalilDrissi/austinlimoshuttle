# Local database for development.
#
# MariaDB 10.11 deliberately matches the InMotion production server
# (verified: "10.11.18-MariaDB"). Do not bump this without checking the host.
#
# Two databases live here:
#   austinlimo            -- the new Django application database
#   austi118_austinlimo   -- the sanitised legacy replica, read by the importers
#
# Usage:  docker compose -f ops/docker-compose.yml up -d

services:
  db:
    image: mariadb:10.11
    container_name: limo-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: localdevonly
      MARIADB_DATABASE: austinlimo
      MARIADB_USER: austinlimo
      MARIADB_PASSWORD: localdevonly
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - limo-db-data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  limo-db-data:
